<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoAlbum{% endblock %} · 家庭相册</title>

    {# 主题初始化（避免闪烁，默认暗色） #}
    <script>
        (function () {
            var t = localStorage.getItem('aa-theme');
            if (!t) t = 'dark';
            document.documentElement.dataset.theme = t;
        })();
    </script>

    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/lightbox.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<div class="layout">

    {# ---------- 侧边栏 ---------- #}
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="/">
            <span class="brand-icon"><i class="bi bi-images"></i></span>
            AutoAlbum
        </a>

        <nav class="nav">
            <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                <i class="bi bi-house-door"></i> 首页
            </a>
            <a href="/gallery" class="nav-link {% if request.endpoint == 'gallery' %}active{% endif %}">
                <i class="bi bi-grid"></i> 画廊
            </a>
            <a href="/browse" class="nav-link {% if request.endpoint == 'browse' %}active{% endif %}">
                <i class="bi bi-compass"></i> 浏览
            </a>
            <a href="/persons" class="nav-link {% if request.endpoint in ['persons', 'person'] %}active{% endif %}">
                <i class="bi bi-people"></i> 人物
            </a>
            <a href="/search" class="nav-link {% if request.endpoint == 'search' %}active{% endif %}">
                <i class="bi bi-search"></i> 搜索
            </a>
        </nav>

        <div class="sidebar-foot">
            <button class="theme-toggle" id="themeToggle" type="button">
                <i class="bi bi-sun"></i><span>切换主题</span>
            </button>
        </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    {# ---------- 主区域 ---------- #}
    <div class="main">
        <header class="topbar">
            <button class="icon-btn hamburger" id="hamburger" type="button" aria-label="菜单">
                <i class="bi bi-list"></i>
            </button>
            <form class="searchbox" action="/search" method="get" role="search">
                <i class="bi bi-search"></i>
                <input type="search" name="q" placeholder="搜索照片、文字、人物…"
                       value="{{ request.args.get('q', '') }}" autocomplete="off">
                <kbd>/</kbd>
            </form>
            <a class="icon-btn" href="/search" title="高级搜索"><i class="bi bi-sliders"></i></a>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

{# ---------- 全局脚本 ---------- #}
<script src="/static/js/utils.js"></script>
<script src="/static/js/lightbox.js"></script>
<script src="/static/js/keyboard-nav.js"></script>
<script src="/static/js/search.js"></script>
<script>
    // 主题切换
    (function () {
        var btn = document.getElementById('themeToggle');
        function syncIcon() {
            var dark = document.documentElement.dataset.theme !== 'light';
            btn.querySelector('i').className = dark ? 'bi bi-sun' : 'bi bi-moon';
            btn.querySelector('span').textContent = dark ? '浅色模式' : '深色模式';
        }
        btn.addEventListener('click', function () {
            var dark = document.documentElement.dataset.theme !== 'light';
            var next = dark ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('aa-theme', next);
            syncIcon();
        });
        syncIcon();
    })();

    // 移动端菜单
    (function () {
        var sidebar = document.getElementById('sidebar');
        var scrim = document.getElementById('scrim');
        document.getElementById('hamburger').addEventListener('click', function () {
            sidebar.classList.add('open');
            scrim.classList.add('show');
        });
        scrim.addEventListener('click', function () {
            sidebar.classList.remove('open');
            scrim.classList.remove('show');
        });
    })();

    // 按 / 聚焦搜索
    document.addEventListener('keydown', function (e) {
        if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            document.querySelector('.searchbox input')?.focus();
        }
    });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
