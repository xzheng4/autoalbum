{% extends "base.html" %}
{% block title %}出错了{% endblock %}

{% block content %}
<div class="empty-state" style="padding-top: 15vh;">
    <div class="empty-state-icon" style="color: var(--danger);"><i class="bi bi-exclamation-triangle"></i></div>
    <h3 class="empty-state-title">出错了</h3>
    <p class="empty-state-description">{{ error or '发生未知错误，请稍后重试' }}</p>
    <div style="margin-top: 20px; display: flex; gap: 8px; justify-content: center;">
        <a href="/" class="btn btn-accent"><i class="bi bi-house"></i> 返回首页</a>
        <a href="javascript:history.back()" class="btn btn-outline"><i class="bi bi-arrow-left"></i> 上一页</a>
    </div>
</div>
{% endblock %}
